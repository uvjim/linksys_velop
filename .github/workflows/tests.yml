name: Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'custom_components/linksys_velop/**'
      - 'tests/**'
      - 'requirements*_test.txt'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  setup-lifecycle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13'
            requirements: requirements_minimum_test.txt
          - python: '3.14'
            requirements: requirements_test.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: python -m pip check
      - run: python -m pytest -q
